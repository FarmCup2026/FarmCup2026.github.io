<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta name="robots" content="noindex,nofollow">
<title>Going to the Farm 2026 (Year 5)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bitter:wght@600;700;800&family=Public+Sans:wght@400;500;600;700&family=Roboto+Mono:wght@500;700&display=swap">
<style>
:root{
  --ground:#E9EAE4; --surface:#FDFDFB; --surface-2:#F2F3ED; --line:#D3D6CC;
  --ink:#1B211C; --ink-2:#4A5249; --ink-3:#767E74;
  --brass:#9C6520; --brass-soft:#F0E3D0;
  --cleveland:#9E4E33; --world:#25646F; --fairway:#4A7540;
  --cleveland-soft:#F3E4DE; --world-soft:#DDEAEC;
  --shadow:0 1px 2px rgba(27,33,28,.07),0 4px 14px rgba(27,33,28,.055);
  --r:11px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --ground:#12170F; --surface:#1B2119; --surface-2:#232A20; --line:#333B2F;
  --ink:#EDEFE7; --ink-2:#B3BAAE; --ink-3:#8A927F;
  --brass:#D2953F; --brass-soft:#33291A;
  --cleveland:#D08055; --world:#63AEBA; --fairway:#8CBB7A;
  --cleveland-soft:#3A2318; --world-soft:#14302F;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 4px 16px rgba(0,0,0,.3);
}}
:root[data-theme="dark"]{
  --ground:#12170F; --surface:#1B2119; --surface-2:#232A20; --line:#333B2F;
  --ink:#EDEFE7; --ink-2:#B3BAAE; --ink-3:#8A927F;
  --brass:#D2953F; --brass-soft:#33291A;
  --cleveland:#D08055; --world:#63AEBA; --fairway:#8CBB7A;
  --cleveland-soft:#3A2318; --world-soft:#14302F;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 4px 16px rgba(0,0,0,.3);
}
*{box-sizing:border-box}
body{
  margin:0; background:var(--ground); color:var(--ink);
  font-family:"Public Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  font-size:15px; line-height:1.5; -webkit-font-smoothing:antialiased;
}
.wrap{max-width:760px;margin:0 auto;padding:0 14px 72px}

/* ---------- header ---------- */
header{
  position:relative; overflow:hidden;
  background:linear-gradient(168deg,#1E2A1B 0%,#16200f 62%,#2A2114 100%);
  color:#EFEDE3; border-bottom:3px solid var(--brass);
}
header .topo{position:absolute;inset:0;opacity:.11;pointer-events:none}
header .inner{position:relative;max-width:760px;margin:0 auto;padding:22px 16px 18px}
.eyebrow{
  font-family:"Roboto Mono",ui-monospace,monospace; font-size:10.5px; font-weight:700;
  letter-spacing:.19em; text-transform:uppercase; color:var(--brass); margin:0 0 7px;
}
h1{
  font-family:"Bitter",Georgia,serif; font-weight:800; font-size:clamp(28px,7.4vw,40px);
  line-height:1.02; letter-spacing:-.017em; margin:0; text-wrap:balance;
}
.sub{margin:8px 0 0;font-size:13.5px;color:#B9C0AC;letter-spacing:.005em}
.yr{display:inline-block;font-size:.62em;font-weight:700;color:var(--brass);letter-spacing:.01em;vertical-align:.22em;white-space:nowrap}
.countdown{
  margin-top:14px; display:inline-flex; align-items:baseline; gap:8px;
  background:rgba(255,255,255,.07); border:1px solid rgba(210,149,63,.34);
  padding:7px 13px; border-radius:99px;
}
.countdown b{font-family:"Roboto Mono",monospace;font-size:17px;font-weight:700;color:#F0D9AF}
.countdown span{font-size:11.5px;letter-spacing:.12em;text-transform:uppercase;color:#A8B09B}

/* ---------- nav ---------- */
nav{
  position:sticky; top:0; z-index:30; background:var(--surface);
  border-bottom:1px solid var(--line); box-shadow:0 1px 8px rgba(0,0,0,.05);
}
.tabs{max-width:760px;margin:0 auto;display:flex;overflow-x:auto;scrollbar-width:none;padding:0 8px}
.tabs::-webkit-scrollbar{display:none}
.tab{
  flex:0 0 auto; appearance:none; background:none; border:none; cursor:pointer;
  font-family:"Public Sans",sans-serif; font-size:12px; font-weight:700;
  letter-spacing:.09em; text-transform:uppercase; color:var(--ink-3);
  padding:14px 12px 11px; border-bottom:3px solid transparent; white-space:nowrap;
}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--brass)}
.tab:focus-visible{outline:2px solid var(--brass);outline-offset:-3px;border-radius:4px}

.daychips{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:0 0 16px}
.daychip{appearance:none;cursor:pointer;font-family:"Public Sans",sans-serif;padding:8px 4px;min-height:46px;
  border-radius:9px;border:1px solid var(--line);background:var(--surface);color:var(--ink-2);box-shadow:var(--shadow)}
.daychip b{display:block;font-size:13px;font-weight:700;color:var(--ink);line-height:1.15}
.daychip i{display:block;font-style:normal;font-family:"Roboto Mono",monospace;font-size:10px;color:var(--ink-3);margin-top:2px}
.daychip[aria-selected="true"]{border-color:var(--brass);border-width:2px;background:var(--brass-soft)}
.daychip[aria-selected="true"] i{color:var(--brass)}
.daychip:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
.dayblock{display:none}
.dayblock.on{display:block}
.dayblock h2:first-child{margin-top:4px}

/* ---------- panels ---------- */
.panel{display:none;padding-top:20px;animation:fade .22s ease}
.panel.on{display:block}
@keyframes fade{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.panel{animation:none}}

h2{
  font-family:"Bitter",Georgia,serif; font-size:12px; font-weight:700;
  letter-spacing:.15em; text-transform:uppercase; color:var(--brass);
  margin:30px 0 12px; display:flex; align-items:center; gap:10px;
}
h2::after{content:"";flex:1;height:1px;background:var(--line)}
h2:first-child{margin-top:4px}

/* ---------- next-up ---------- */
.nextup{
  background:var(--surface); border:1px solid var(--line); border-left:4px solid var(--brass);
  border-radius:var(--r); padding:14px 16px; margin-bottom:20px; box-shadow:var(--shadow);
}
.nextup .lbl{
  font-family:"Roboto Mono",monospace;font-size:10px;font-weight:700;letter-spacing:.17em;
  text-transform:uppercase;color:var(--brass);margin-bottom:5px;
}
.nextup .ttl{font-family:"Bitter",serif;font-weight:700;font-size:19px;line-height:1.2;margin-bottom:3px}
.nextup .meta{font-size:13px;color:var(--ink-2)}

/* ---------- timeline ---------- */
.day{position:relative;padding-left:20px}
.day::before{content:"";position:absolute;left:4px;top:10px;bottom:10px;width:2px;background:var(--line)}
.ev{position:relative;margin-bottom:9px}
.ev::before{
  content:"";position:absolute;left:-20px;top:17px;width:10px;height:10px;border-radius:50%;
  background:var(--surface);border:2px solid var(--line);
}
.ev.golf::before{background:var(--fairway);border-color:var(--fairway)}
.ev.key::before{background:var(--brass);border-color:var(--brass)}
.card{
  width:100%;text-align:left;appearance:none;cursor:pointer;
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
  padding:12px 14px;box-shadow:var(--shadow);font-family:inherit;color:inherit;
  display:block;transition:border-color .15s;
}
.card:hover{border-color:var(--brass)}
.card:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
.ev.golf .card{border-left:3px solid var(--fairway)}
.ev.key  .card{border-left:3px solid var(--brass)}
.chead{display:flex;gap:11px;align-items:flex-start}
.time{
  font-family:"Roboto Mono",monospace;font-size:13px;font-weight:700;
  color:var(--ink);flex:0 0 66px;padding-top:1px;font-variant-numeric:tabular-nums;
}
.cbody{flex:1;min-width:0}
.what{font-weight:700;font-size:15px;line-height:1.28;letter-spacing:-.006em}
.where{font-size:12.5px;color:var(--ink-2);margin-top:2px}
.caret{flex:0 0 auto;color:var(--ink-3);font-size:11px;padding-top:4px;transition:transform .2s}
.card[aria-expanded="true"] .caret{transform:rotate(90deg)}
.detail{display:none;margin-top:11px;padding-top:11px;border-top:1px solid var(--line);font-size:13.5px;color:var(--ink-2);line-height:1.55}
.card[aria-expanded="true"] + .detail{display:block}
.detail p{margin:0 0 8px}
.detail p:last-child{margin-bottom:0}
.detail a{color:var(--brass);font-weight:600}
/* inline links are thumb targets on a phone: give them real height without breaking the line */
.detail a:not(.maplink),.row .v a,.row .k a,.note a,.fmt-r a,.fmt-ex a,.crs-note a,.flag a{
  display:inline-block;min-height:34px;line-height:34px;padding:0 4px;margin:0 -4px;
  border-radius:5px;text-decoration:none;border-bottom:1px solid currentColor;
}
.detail a:not(.maplink):active,.row .v a:active,.note a:active{background:var(--brass-soft)}
a[href^="tel:"]::before{content:"\260E\FE0E";margin-right:5px;font-size:.85em;opacity:.75}
.maplink{
  display:flex;align-items:center;gap:10px;margin:0 0 11px;padding:9px 11px;
  border:1px solid var(--brass);border-radius:9px;background:var(--brass-soft);
  text-decoration:none;color:var(--ink);
}
.maplink:hover{background:var(--surface-2);border-color:var(--brass)}
.maplink:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
.maplink .pin{color:var(--brass);font-size:12px;line-height:1;flex:0 0 auto}
.maplink .mtxt{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.maplink .mtxt b{font-size:13.5px;font-weight:700;color:var(--ink)}
.maplink .mtxt i{font-size:11px;font-style:normal;color:var(--ink-3)}
.maplink .mgo{color:var(--brass);font-size:20px;line-height:1;flex:0 0 auto}

.pill{
  display:inline-block;font-family:"Roboto Mono",monospace;font-size:9.5px;font-weight:700;
  letter-spacing:.12em;text-transform:uppercase;padding:3px 7px;border-radius:4px;
  margin:0 5px 5px 0;vertical-align:middle;
}
.p-golf{background:var(--brass-soft);color:var(--brass)}
.p-flag{background:var(--cleveland-soft);color:var(--cleveland)}
.p-all {background:var(--surface-2);color:var(--ink-2)}

.flag{
  background:var(--cleveland-soft);border:1px solid var(--cleveland);border-radius:var(--r);
  padding:11px 14px;margin:0 0 12px;font-size:13.5px;color:var(--ink);line-height:1.5;
}
.flag > b:first-child{color:var(--cleveland);display:block;margin-bottom:4px;font-size:11px;letter-spacing:.11em;text-transform:uppercase;font-family:"Roboto Mono",monospace}
.flag b{font-weight:700;color:var(--ink)}

/* ---------- generic blocks ---------- */
.box{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden}
.row{display:flex;gap:12px;padding:11px 14px;border-bottom:1px solid var(--line);align-items:center}
.row:last-child{border-bottom:none}
.row .k{flex:0 0 40%;font-size:12.5px;color:var(--ink-2);font-weight:600}
.row .v{flex:1;font-size:13.5px;font-weight:600;min-width:0}
.row .v a{color:var(--brass)}
.mono{font-family:"Roboto Mono",monospace;font-variant-numeric:tabular-nums}

/* contacts */
.contact{display:flex;align-items:center;gap:12px;padding:11px 14px;border-bottom:1px solid var(--line);text-decoration:none;color:inherit}
.contact:last-child{border-bottom:none}
.contact:hover{background:var(--surface-2)}
.av{
  flex:0 0 36px;height:36px;border-radius:50%;display:grid;place-items:center;
  font-family:"Bitter",serif;font-weight:700;font-size:13px;color:#fff;
}
.cinfo{flex:1;min-width:0}
.cname{font-weight:700;font-size:14px}
.cfull{font-weight:400;font-size:11.5px;color:var(--ink-3);margin-left:5px}
.cmeta{font-size:12px;color:var(--ink-2)}
.chcp{font-family:"Roboto Mono",monospace;font-weight:700;font-size:13px;color:var(--ink-2);flex:0 0 auto}

/* teams */
.teams{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.team{border-radius:var(--r);overflow:hidden;border:1px solid var(--line);background:var(--surface);box-shadow:var(--shadow)}
.thead{padding:9px 12px;color:#fff;font-family:"Bitter",serif;font-weight:700;font-size:14px;letter-spacing:-.01em}
.thead small{display:block;font-family:"Roboto Mono",monospace;font-size:9.5px;font-weight:500;letter-spacing:.1em;opacity:.82;margin-top:1px}
.tmem{padding:8px 12px;border-bottom:1px solid var(--line);font-size:13px;display:flex;justify-content:space-between;gap:6px}
.tmem:last-child{border-bottom:none}
.tmem span:last-child{font-family:"Roboto Mono",monospace;color:var(--ink-3);font-size:12px}

/* scoreboard */
.score{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px;padding:18px 16px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.sside{text-align:center}
.sname{font-family:"Roboto Mono",monospace;font-size:10px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;margin-bottom:4px}
.spts{font-family:"Bitter",serif;font-size:38px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
.sdash{color:var(--ink-3);font-size:15px;font-family:"Roboto Mono",monospace}
.sstat{text-align:center;font-size:12.5px;color:var(--ink-2);margin-top:12px}
.sstat b{color:var(--brass)}

.match{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:11px 13px;margin-bottom:8px;box-shadow:var(--shadow)}
.mtop{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px}
.mses{font-family:"Roboto Mono",monospace;font-size:9.5px;font-weight:700;letter-spacing:.11em;text-transform:uppercase;color:var(--ink-3)}
.mvs{display:grid;grid-template-columns:1fr auto 1fr;gap:9px;align-items:center;font-size:13px}
.mvs .a{font-weight:600;color:var(--cleveland);text-align:right}
.mvs .b{font-weight:600;color:var(--world)}
.mvs .v{font-family:"Roboto Mono",monospace;font-size:10px;color:var(--ink-3)}
.mbtns{display:flex;gap:6px;margin-top:9px}
.mbtn{
  flex:1;appearance:none;cursor:pointer;font-family:"Public Sans",sans-serif;font-size:11px;font-weight:700;
  letter-spacing:.05em;padding:10px 4px;min-height:38px;border-radius:6px;border:1px solid var(--line);
  background:var(--surface-2);color:var(--ink-2);transition:all .13s;
}
.mbtn:hover{border-color:var(--brass);color:var(--ink)}
.mbtn:focus-visible{outline:2px solid var(--brass);outline-offset:1px}
.mbtn.on[data-w="Cleveland"]{background:var(--cleveland);border-color:var(--cleveland);color:#fff}
.mbtn.on[data-w="World"]{background:var(--world);border-color:var(--world);color:#fff}
.mbtn.on[data-w="Halved"]{background:var(--ink-2);border-color:var(--ink-2);color:var(--surface)}
.live{border:1px solid var(--brass);border-radius:var(--r);background:var(--surface);padding:12px 14px;margin:0 0 18px;box-shadow:var(--shadow)}
.live .lh{display:flex;align-items:center;gap:8px;font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--brass);font-weight:800}
.live .dot{width:8px;height:8px;border-radius:50%;background:var(--brass);flex:0 0 8px}
.live .lu{font-size:11.5px;color:var(--ink-3);margin-top:5px}
.live .lmsg{font-size:13.5px;color:var(--ink);margin-top:9px;line-height:1.5}
.sk{border-top:1px solid var(--line);padding:12px 14px}
.sk:first-child{border-top:0}
.skh{display:flex;justify-content:space-between;gap:10px;align-items:baseline;margin-bottom:6px}
.skr{font-weight:700;color:var(--brass);font-size:13px}
.skp{font-size:11.5px;color:var(--ink-3);text-align:right}
.skw{display:flex;justify-content:space-between;gap:10px;font-size:13px;padding:5px 0;border-bottom:1px dashed var(--line)}
.skw:last-child{border-bottom:0}
.skw b{font-variant-numeric:tabular-nums;color:var(--ink)}
.skn{font-size:11.5px;color:var(--ink-3);font-style:italic;margin-top:7px;line-height:1.45}
.livenote{font-size:11.5px;color:var(--ink-3);text-align:center;margin-top:10px;font-style:italic}

/* money */
.mtable{width:100%;border-collapse:collapse;font-size:12.5px}
.mtable th{
  text-align:left;font-family:"Roboto Mono",monospace;font-size:9.5px;font-weight:700;
  letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3);padding:9px 7px;
  border-bottom:1px solid var(--line);
}
.mtable td{padding:9px 7px;border-bottom:1px solid var(--line)}
.mtable td:first-child,.mtable th:first-child{padding-left:12px}
.mtable td:last-child,.mtable th:last-child{padding-right:12px}
.mtable tr:last-child td{border-bottom:none}
.mtable .num{text-align:right;font-family:"Roboto Mono",monospace;font-variant-numeric:tabular-nums;font-weight:600}
.mtable tfoot td{font-weight:700;background:var(--surface-2)}
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}

.note{font-size:12.5px;color:var(--ink-3);line-height:1.55;margin:10px 2px 0}
.note strong{color:var(--ink-2)}
.vlink{color:inherit;text-decoration:none;border-bottom:1px solid var(--brass)}
.vlink:hover{color:var(--brass)}

footer{text-align:center;padding:34px 14px 10px;color:var(--ink-3);font-size:11.5px;line-height:1.7}
footer .m{font-family:"Roboto Mono",monospace;letter-spacing:.09em;text-transform:uppercase;font-size:10px}

/* ---------- format blocks (The Games) ---------- */
.fmt{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:14px 15px;margin-bottom:12px}
.fmt-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:8px}
.fmt-n{font-family:"Bitter",Georgia,serif;font-weight:800;font-size:19px;letter-spacing:-.015em}
.fmt-w{font-family:"Roboto Mono",monospace;font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--brass);white-space:nowrap}
.fmt-one{margin:0 0 11px;font-size:14.5px;font-weight:600;line-height:1.42;color:var(--fairway);text-wrap:balance}
.fmt-r{margin:0;padding:0 0 0 17px;font-size:13.5px;line-height:1.58;color:var(--ink-2)}
.fmt-r li{margin-bottom:7px}
.fmt-r li::marker{color:var(--brass)}
.fmt-ex{margin-top:12px;padding:11px 13px;background:var(--surface-2);border-left:3px solid var(--brass);border-radius:0 7px 7px 0;font-size:13px;line-height:1.55;color:var(--ink-2)}
.fmt-ex > b:first-child{display:block;font-family:"Roboto Mono",monospace;font-size:9.5px;font-weight:700;letter-spacing:.13em;text-transform:uppercase;color:var(--brass);margin-bottom:5px}
.fmt-ex b{font-weight:700;color:var(--ink)}

/* worked example */
.wex{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:14px 15px;margin-top:12px;font-size:13px;color:var(--ink-2);line-height:1.55}
.wex > b:first-child{display:block;font-family:"Roboto Mono",monospace;font-size:9.5px;font-weight:700;letter-spacing:.13em;text-transform:uppercase;color:var(--brass);margin-bottom:9px}
.wex .mtable{margin-bottom:0}
.wex b{font-weight:700;color:var(--ink)}

/* the creed */
.creed{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden}
.creed-l{display:flex;gap:12px;align-items:flex-start;padding:11px 14px;border-bottom:1px solid var(--line);font-size:14px;font-weight:600;line-height:1.4}
.creed-l:last-child{border-bottom:none}
.creed-l span{flex:0 0 21px;height:21px;border-radius:50%;background:var(--brass);color:var(--surface);display:grid;place-items:center;font-family:"Roboto Mono",monospace;font-size:11px;font-weight:700;margin-top:1px}

/* course cards */
.crs{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:14px 15px;margin-bottom:12px}
.crs-h{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap;margin-bottom:9px}
.crs-n{font-family:"Bitter",Georgia,serif;font-weight:800;font-size:18px;letter-spacing:-.015em;line-height:1.15}
.crs-a{font-size:12px;color:var(--ink-3);margin-top:2px}
.crs-m{display:flex;gap:9px;flex-wrap:wrap;font-size:10.5px;font-weight:700;letter-spacing:.06em;color:var(--ink-2);padding-top:3px}
.crs-note{margin:0 0 11px;font-size:13px;line-height:1.55;color:var(--ink-2)}
.tees{font-size:12.5px}
.tees tr.rec td{background:var(--brass-soft);font-weight:700;color:var(--ink)}
.tees tr.rec td:first-child{color:var(--brass)}

</style>

    {t:"~7:00 PM", at:D(10,1,19,0), w:"Staind &middot; Seether &middot; Hoobastank &middot; Hinder", p:"Thunder Ridge Nature Arena", loc:"thunder", golf:0, key:1, tags:["Concert crew"],
     d:"<p><b>Staind&rsquo;s &lsquo;Break the Cycle&rsquo; 25th Anniversary Tour.</b> Seether is direct support; Hoobastank and Hinder open.</p><p><i>Break the Cycle</i> came out in 2001 and went five-times platinum. &ldquo;It&rsquo;s Been Awhile&rdquo; owned rock radio for what felt like a decade, and &ldquo;Outside&rdquo;, &ldquo;Fade&rdquo; and &ldquo;For You&rdquo; came off the same record. Aaron Lewis on the tour: <i>&ldquo;25 years later to be touring, celebrating this album&hellip; it&rsquo;s like one big family reunion.&rdquo;</i></p><p>Four bands, all of them peak 2001&ndash;2006. Set times aren&rsquo;t published, but billing order puts <b>Staind on around 9:00&ndash;9:15</b>.</p><p><b>The venue:</b> Johnny Morris spent a decade building Thunder Ridge as &ldquo;a gift to the people and heritage of the Ozarks&rdquo; &mdash; 18,000 seats terraced into the hillside with Table Rock Lake and the Ozarks behind the stage.</p><p><b>Bring a layer.</b> Outdoor amphitheatre, October, after dark. The quarter-zip you packed for golf.</p>"},

/* ============================ RENDER ============================ */
const $ = s => document.querySelector(s);
const fmtTel = p => "("+p.slice(0,3)+") "+p.slice(3,6)+"-"+p.slice(6);
const money = n => "$"+n.toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2});
const m0 = n => "$"+Math.round(n).toLocaleString("en-US");

const TABS = [{id:"itin",label:"Itinerary"},
  {id:"cup",label:"The Cup"},{id:"games",label:"The Games"},{id:"golf",label:"Courses"},
  {id:"money",label:"Money"},{id:"bank",label:"The Bank"},{id:"resort",label:"Resort"}];

function evHTML(e){
  const cls = "ev"+(e.golf?" golf":"")+(e.key?" key":"");
  const tags = (e.tags||[]).map(t=>{
    let c="p-all";
    if(/BOOK|CLOSES|TIGHT|Don't miss/i.test(t)) c="p-flag";
    else if(/Best Ball|Pins|SINGLES|Session|points/i.test(t)) c="p-golf";
    return '<span class="pill '+c+'">'+t+'</span>';
  }).join("");
  return '<div class="'+cls+'"><button class="card" aria-expanded="false" data-acc>'
    + '<div class="chead"><div class="time">'+e.t+'</div><div class="cbody">'
    + '<div class="what">'+e.w+'</div><div class="where">'+e.p+'</div>'
    + (tags?'<div style="margin-top:6px">'+tags+'</div>':'')
    + '</div><div class="caret">&#9654;</div></div></button>'
    + '<div class="detail">'+(e.loc?mapBtn(e.loc):'')+e.d+'</div></div>';
}
function itinPanel(){
  return '<div class="panel" id="p-itin" role="tabpanel">'
  + '<div class="daychips" id="daychips" role="tablist" aria-label="Day">'
  + DAYS.map(d=>'<button type="button" class="daychip" role="tab" data-day="'+d.id+'" aria-selected="false">'
      + '<b>'+d.label.split(" ")[0]+'</b><i>'+d.label.split(" ")[1]+'</i></button>').join("")
  + '</div>'
  + '<div id="nextup"></div>'
  + DAYS.map(d=>'<section class="dayblock" data-dayblock="'+d.id+'">'
      + '<h2>'+d.title+'</h2>'
      + '<p class="note" style="margin:-6px 2px 14px">'+d.sub+'</p>'
      + '<div class="day">'+d.events.map(evHTML).join("")+'</div></section>').join("")
  + '</div>';
}

const rowsHTML = arr => arr.map(r=>'<div class="row"><div class="k" style="flex:0 0 '+(r[2]||"40%")+'">'+r[0]
  +'</div><div class="v" style="font-weight:400;font-size:12.5px;color:var(--ink-2)">'+r[1]+'</div></div>').join("");

/* ---------- The Cup ---------- */
function cupPanel(){
  const teamCard = k => {
    const T=TEAMS[k], tot=T.men.reduce((s,m)=>s+m[1],0);
    return '<div class="team"><div class="thead" style="background:var(--'+k.toLowerCase()+')">'+T.name
      +'<small>'+tot.toFixed(1)+' combined</small></div>'
      + T.men.map(m=>'<div class="tmem"><span>'+m[0]+'</span><span>'+m[1].toFixed(1)+'</span></div>').join("")+'</div>';
  };
  return '<div class="panel" id="p-cup" role="tabpanel">'
  + '<div id="liveband"></div>'
  + '<h2>The Farm Cup</h2>'
  + '<div class="score"><div class="sside"><div class="sname" style="color:var(--cleveland)">Cleveland</div>'
    + '<div class="spts" id="ptsA" style="color:var(--cleveland)">0</div></div><div class="sdash">v</div>'
    + '<div class="sside"><div class="sname" style="color:var(--world)">The World</div>'
    + '<div class="spts" id="ptsB" style="color:var(--world)">0</div></div></div>'
  + '<div class="sstat" id="sstat">14 points on the table. <b>First to 7&frac12; wins it.</b></div>'
  + '<h2>Teams</h2><div class="teams">'+teamCard("Cleveland")+teamCard("World")+'</div>'
  + '<p class="note">Snake-drafted by handicap then adjusted &mdash; the two sides are within <strong>1.3 strokes</strong>. Partners rotate across the first three sessions, so by Saturday every man has played alongside each of his teammates exactly once. The Saturday tee split is deliberate too &mdash; it&rsquo;s the only arrangement that gets <b>every man a round with every other man across the three full-length courses</b>.</p>'
  + '<h2>The matches</h2><div id="matches"></div>'
  + '<div class="livenote" id="livenote">Tap a winner as each match finishes. This saves on your own phone, so pick one scorekeeper and let him run it.</div>'
  + '<h2>Scoring</h2><div class="box">'
  + rowsHTML([["Each match","Worth 1 point. Win it 1, halve it &frac12; each, lose it 0.","38%"],
              ["14 points","Eleven on the golf course, three on Table Rock Lake.","38%"],
              ["To win the cup","First team to <b>7&frac12;</b>. Get there and it&rsquo;s over.","38%"],
              ["A tie","7&ndash;7 and the cup is shared &mdash; or settle it on the 19th, closest to the pin.","38%"],
              ["The shape","Saturday carries 8 of the 14 &mdash; three on the water, one at Mountain Top, four in the singles. Nobody is out of it until Saturday evening.","38%"]])
  + '</div>'
  + '<p class="note">New to these formats? The <strong>Games</strong> tab explains all of it in plain English. Read it before Thursday.</p>'
  + '</div>';
}

  + '</div>'

      "Two of you against two of them. Everyone plays their own ball, and your team&rsquo;s better score counts.",
      ["You and your partner each play your own ball all the way to the hole. So do both opponents, and your side keeps whichever of your two scores is better &mdash; your best ball.",
       "At the end of the hole your team bins the worse of your two net scores and keeps the better one. So do they. Those two numbers decide the hole.",

  + '<div class="box">'

              ["Big Bass","Longest single black bass, measured in <b>inches</b> on the guide&rsquo;s board. Photograph it next to the tape. Length rather than weight, because juggling a scale in a moving boat is a nuisance and every guide has a bump board.","30%"],

  + '<div class="box">'
  + rowsHTML([["You find out in the clubhouse","Nobody is comparing eight net scores on the 7th tee. Both cards go <b>side by side over a beer afterwards</b> and Ryan reads out the winners. That&rsquo;s how the men&rsquo;s league runs it and walking in not knowing is half the fun.","32%"],
              ["Every hole is worth the same","$200 a round over 18 holes is <b>$11.11 a hole</b>, every round, all weekend. Tie one and the next is worth $22. Tie again and it&rsquo;s $33. Call it eleven dollars and let the ledger do the cents.","32%"],
              ["Winning a hole","All eight net scores compared, <b>across both groups</b>. The single lowest net takes it. Everyone plays off their own full GHIN course handicap &mdash; nobody drops to zero here, that&rsquo;s only for the Cup matches.","32%"],
              ["Ties kill the hole","Two or more men tie for low net and <b>nobody wins</b>. This is the rule everyone forgets. With eight players and strokes flying about, expect roughly half the holes to tie.","32%"],
              ["How it accumulates","A tied hole isn&rsquo;t lost, it <b>carries onto the next one</b>. Tie the 2nd and the 3rd is worth $22. Tie that too and the 4th is worth $33. <b>Carries run right through the weekend</b>, so a dead Thursday means Friday morning starts fat and a hole late on Saturday can be worth $60 or $70.","32%"],

  + '<div class="box" style="margin-top:12px">'

              ["Cliffhangers looks odd","It&rsquo;s an 18-hole par-3 course with a slope of 89, so GHIN will hand a 31 index something like a <b>23</b> and a 3 index something like a <b>1</b>. That&rsquo;s correct. Pull it from the app and don&rsquo;t argue with it.","32%"],

/* ============================ BUILD ============================ */
$("#tabs").innerHTML = TABS.map((t,i)=>'<button class="tab" role="tab" data-t="'+t.id+'" aria-selected="'+(i===0)+'" aria-controls="p-'+t.id+'">'+t.label+'</button>').join("");
$("#panels").innerHTML = itinPanel() + cupPanel() + gamesPanel() + golfPanel() + moneyPanel() + bankPanel() + resortPanel();

function show(id){
  document.querySelectorAll(".panel").forEach(p=>p.classList.toggle("on", p.id==="p-"+id));
  document.querySelectorAll(".tab").forEach(b=>{
    const on = b.dataset.t===id;
    b.setAttribute("aria-selected", String(on));
    if(on) b.scrollIntoView({block:"nearest",inline:"nearest"});
  });
  window.scrollTo({top:0,behavior:"instant"});
}
$("#tabs").addEventListener("click", e=>{ const b=e.target.closest(".tab"); if(b) show(b.dataset.t); });
document.addEventListener("click", e=>{
  const b = e.target.closest("[data-acc]"); if(!b) return;
  b.setAttribute("aria-expanded", b.getAttribute("aria-expanded")==="true" ? "false" : "true");
});

const NOW = () => new Date();
const ALL = DAYS.flatMap(d => d.events.map(e => ({...e, day:d.id})));
function pickDay(){
  const n=NOW();
  const d=DAYS.find(day=>day.events.some(e=>e.at.toDateString()===n.toDateString()));
  return d ? d.id : DAYS[0].id;
}
let curDay = pickDay();
function showDay(id, scroll){
  curDay = id;
  document.querySelectorAll("[data-dayblock]").forEach(b=>b.classList.toggle("on", b.dataset.dayblock===id));
  document.querySelectorAll(".daychip").forEach(c=>c.setAttribute("aria-selected", String(c.dataset.day===id)));
  renderNext();
  if(scroll) window.scrollTo({top:0,behavior:"instant"});
}
$("#daychips").addEventListener("click", e=>{ const c=e.target.closest(".daychip"); if(c) showDay(c.dataset.day, true); });

function renderNext(){
  const host=$("#nextup"); if(!host) return;
  const n=NOW(), up=ALL.find(e=>e.at>n);
  host.innerHTML = (up && up.day===curDay)
    ? '<div class="nextup"><div class="lbl">Next up</div><div class="ttl">'+up.w+'</div><div class="meta">'+up.t+' &middot; '+up.p+'</div></div>'
    : "";
}
showDay(curDay, false);
show("itin");

function tickCD(){
  const start=D(10,1,8,15), end=D(10,4,12,29), n=NOW(), cd=$("#cd"), lbl=$("#cdl");
  if(n<start){ const days=Math.ceil((start-n)/864e5); cd.textContent=days; lbl.textContent=days===1?"day out":"days out"; }
  else if(n<=end){ cd.textContent="LIVE"; lbl.textContent="we're there"; }
  else { cd.textContent="—"; lbl.textContent="that's a wrap"; }
}
tickCD(); setInterval(()=>{tickCD();renderNext();},60000);

/* ---------- the Cup leaderboard ---------- */
let results={};
try{ const raw=localStorage.getItem("farmcup2"); if(raw) results=JSON.parse(raw)||{}; }catch(_){}

/* built once, then only the button state changes — so a tap never rebuilds the list,
   never drops focus, and never moves the page under your thumb */
function buildMatches(){
  const host=$("#matches"); if(!host) return;
  host.innerHTML = MATCHES.map(m=>
      '<div class="match"><div class="mtop"><span class="mses">'+m.s+'</span>'
    + '<span class="pill p-golf" style="margin:0">'+m.f+'</span></div>'
    + '<div class="mvs"><span class="a">'+m.a+'</span><span class="v">v</span><span class="b">'+m.b+'</span></div>'
    + '<div class="mbtns" role="group" aria-label="'+m.a.replace(/&amp;/g,"and")+' versus '+m.b.replace(/&amp;/g,"and")+'">'
    + [['Cleveland','Cleveland'],['Halved','Halved'],['World','The World']].map(x=>'<button type="button" class="mbtn" aria-pressed="false" data-w="'+x[0]+'" data-m="'+m.id+'">'+x[1]+'</button>').join("")
    + '</div></div>').join("");
  paintCup();
}
function paintCup(){
  document.querySelectorAll(".mbtn").forEach(b=>{
    const on = results[b.dataset.m]===b.dataset.w;
    b.classList.toggle("on", on);
    b.setAttribute("aria-pressed", String(on));
  });
  let A=0,B=0;
  Object.values(results).forEach(v=>{ if(v==="Cleveland")A++; else if(v==="World")B++; else if(v==="Halved"){A+=.5;B+=.5;} });
  const f = x => x===0 ? "0" : String(x).replace(/\.5$/,"½").replace(/^0½$/,"½");
  $("#ptsA").textContent=f(A); $("#ptsB").textContent=f(B);
  const played=Object.keys(results).length, st=$("#sstat");
  if(A>=7.5) st.innerHTML='<b>Cleveland wins the Farm Cup.</b>';
  else if(B>=7.5) st.innerHTML='<b>The World wins the Farm Cup.</b>';
  else if(played===14) st.innerHTML='<b>7&ndash;7. Shared &mdash; or settle it on the 19th.</b>';
  else st.innerHTML=(14-played)+' match'+(14-played===1?'':'es')+' left. <b>First to 7&frac12; wins it.</b>';
}
buildMatches();
document.addEventListener("click", e=>{
  const b=e.target.closest(".mbtn"); if(!b) return;
  const id=b.dataset.m, w=b.dataset.w;
  if(results[id]===w) delete results[id]; else results[id]=w;
  paintCup();
  try{ localStorage.setItem("farmcup2", JSON.stringify(results)); }catch(_){}
});


/* ---------- live results feed ----------
   results.json is the published source of truth. Anything it names overrides a
   local tap; anything it doesn't name still falls back to this phone's taps.
   Missing, empty or broken file = the page renders exactly as it does today. */
const esc = t => String(t==null?"":t).replace(/[&<>]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
const mo  = n => { const v=Number(n); return isFinite(v) ? "$"+v.toFixed(2).replace(/\.00$/,"") : ""; };

function paintLive(d){
  if(d.matches && typeof d.matches==="object"){
    const ok=new Set(MATCHES.map(m=>m.id)), val=["Cleveland","World","Halved"];
    let n=0;
    Object.keys(d.matches).forEach(k=>{
      if(ok.has(k) && val.indexOf(d.matches[k])>-1){ results[k]=d.matches[k]; n++; }
    });
    if(n){ paintCup(); const ln=$("#livenote"); if(ln) ln.textContent="Results published by Ryan. Your own taps only show for matches he hasn't posted yet."; }
  }
  const band=$("#liveband");
  if(band && (d.updated || d.headline)){
    band.innerHTML='<div class="live"><div class="lh"><span class="dot"></span>Live</div>'
      + (d.updated  ? '<div class="lu">Updated '+esc(d.updated)+'</div>' : '')
      + (d.headline ? '<div class="lmsg">'+esc(d.headline)+'</div>' : '')
      + '</div>';
  }
  const host=$("#liveskins");
  if(host && Object.prototype.toString.call(d.skins)==="[object Array]" && d.skins.length){
    host.innerHTML='<h2>Skins so far</h2><div class="box">'
    + d.skins.map(function(s){
        const ws=(s.winners&&s.winners.length?s.winners:[]).map(function(x){
          const h=Number(x.holes)||0;
          return '<div class="skw"><span>'+esc(x.who)+(h?' &middot; '+h+' hole'+(h===1?'':'s'):'')
               + '</span><b>'+mo(x.amt)+'</b></div>';
        }).join("") || '<div class="skw"><span>No skins won</span><b>all carried</b></div>';
        const meta=[ s.pot!=null?mo(s.pot)+' pot':'', s.carried?mo(s.carried)+' carried in':'' ].filter(Boolean).join(' &middot; ');
        return '<div class="sk"><div class="skh"><span class="skr">'+esc(s.round)+'</span>'
             + (meta?'<span class="skp">'+meta+'</span>':'') + '</div>' + ws
             + (s.note?'<div class="skn">'+esc(s.note)+'</div>':'') + '</div>';
      }).join("")
    + '</div>';
  }
}
try{
  fetch("results.json?t="+Date.now(), {cache:"no-store"})
    .then(function(r){ return r.ok ? r.json() : null; })
    .then(function(d){ if(d && typeof d==="object") paintLive(d); })
    .catch(function(){});
}catch(_){}

</script>
