}
/* scrim over the photo — the header text is light, so the picture has to sit back */
header::before{
  content:""; position:absolute; inset:0; pointer-events:none;
  background:
    linear-gradient(96deg,rgba(14,21,10,.90) 0%,rgba(14,21,10,.78) 34%,rgba(14,21,10,.44) 66%,rgba(16,23,12,.36) 100%),
    linear-gradient(180deg,rgba(10,16,7,.30) 0%,rgba(10,16,7,0) 34%,rgba(10,16,7,.34) 100%);
}
header .topo{position:absolute;inset:0;opacity:.07;pointer-events:none}
header .inner{position:relative;max-width:760px;margin:0 auto;padding:22px 16px 18px}
.eyebrow{
  font-family:"Roboto Mono",ui-monospace,monospace; font-size:10.5px; font-weight:700;
  letter-spacing:.19em; text-transform:uppercase; color:var(--brass); margin:0 0 7px;
}
h1{
  text-shadow:0 2px 10px rgba(0,0,0,.55);
  font-family:"Bitter",Georgia,serif; font-weight:800; font-size:clamp(28px,7.4vw,40px);
  line-height:1.02; letter-spacing:-.017em; margin:0; text-wrap:balance;
}
.sub{margin:8px 0 0;font-size:13.5px;color:#C6CCBA;letter-spacing:.005em;text-shadow:0 1px 6px rgba(0,0,0,.5)}
.yr{display:inline-block;font-size:.62em;font-weight:700;color:var(--brass);letter-spacing:.01em;vertical-align:.22em;white-space:nowrap}
.countdown{
  margin-top:14px; display:inline-flex; align-items:baseline; gap:8px;
  background:rgba(10,16,8,.42); border:1px solid rgba(210,149,63,.42); backdrop-filter:blur(3px);
  padding:7px 13px; border-radius:99px;
}
.countdown b{font-family:"Roboto Mono",monospace;font-size:17px;font-weight:700;color:#F5E2BC}
.countdown span{font-size:11.5px;letter-spacing:.12em;text-transform:uppercase;color:#A8B09B}

/* ---------- nav ---------- */
nav{
  position:sticky; top:0; z-index:30; background:var(--surface);
  border-bottom:1px solid var(--line); box-shadow:0 1px 8px rgba(0,0,0,.05);
}
.tabs{max-width:760px;margin:0 auto;display:flex;overflow-x:auto;scrollbar-width:none;padding:0 8px}
.tabs::-webkit-scrollbar{display:none}
.tab{
  flex:0 0 auto; appearance:none; background:none; border:none; cursor:pointer;
  font-family:"Public Sans",sans-serif; font-size:12px; font-weight:700;
  letter-spacing:.09em; text-transform:uppercase; color:var(--ink-3);
  padding:14px 12px 11px; border-bottom:3px solid transparent; white-space:nowrap;
}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--brass)}
.tab:focus-visible{outline:2px solid var(--brass);outline-offset:-3px;border-radius:4px}

.daychips{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:0 0 16px}
.daychip{appearance:none;cursor:pointer;font-family:"Public Sans",sans-serif;padding:8px 4px;min-height:46px;
  border-radius:9px;border:1px solid var(--line);background:var(--surface);color:var(--ink-2);box-shadow:var(--shadow)}
.daychip b{display:block;font-size:13px;font-weight:700;color:var(--ink);line-height:1.15}
.daychip i{display:block;font-style:normal;font-family:"Roboto Mono",monospace;font-size:10px;color:var(--ink-3);margin-top:2px}
.daychip[aria-selected="true"]{border-color:var(--brass);border-width:2px;background:var(--brass-soft)}
.daychip[aria-selected="true"] i{color:var(--brass)}
.daychip:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
.dayblock{display:none}
.dayblock.on{display:block}
.dayblock h2:first-child{margin-top:4px}

/* ---------- panels ---------- */
.panel{display:none;padding-top:20px;animation:fade .22s ease}
.panel.on{display:block}
@keyframes fade{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.panel{animation:none}}

h2{
  font-family:"Bitter",Georgia,serif; font-size:12px; font-weight:700;
  letter-spacing:.15em; text-transform:uppercase; color:var(--brass);
  margin:30px 0 12px; display:flex; align-items:center; gap:10px;
}
h2::after{content:"";flex:1;height:1px;background:var(--line)}
h2:first-child{margin-top:4px}

/* ---------- next-up ---------- */
.nextup{
  background:var(--surface); border:1px solid var(--line); border-left:4px solid var(--brass);
  border-radius:var(--r); padding:14px 16px; margin-bottom:20px; box-shadow:var(--shadow);
}
.nextup .lbl{
  font-family:"Roboto Mono",monospace;font-size:10px;font-weight:700;letter-spacing:.17em;
  text-transform:uppercase;color:var(--brass);margin-bottom:5px;
}
.nextup .ttl{font-family:"Bitter",serif;font-weight:700;font-size:19px;line-height:1.2;margin-bottom:3px}
.nextup .meta{font-size:13px;color:var(--ink-2)}

/* ---------- timeline ---------- */
.day{position:relative;padding-left:20px}
.day::before{content:"";position:absolute;left:4px;top:10px;bottom:10px;width:2px;background:var(--line)}
.ev{position:relative;margin-bottom:9px}
.ev::before{
  content:"";position:absolute;left:-20px;top:17px;width:10px;height:10px;border-radius:50%;
  background:var(--surface);border:2px solid var(--line);
}
.ev.golf::before{background:var(--fairway);border-color:var(--fairway)}
.ev.key::before{background:var(--brass);border-color:var(--brass)}
.card{
  width:100%;text-align:left;appearance:none;cursor:pointer;
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
  padding:12px 14px;box-shadow:var(--shadow);font-family:inherit;color:inherit;
  display:block;transition:border-color .15s;
}
.card:hover{border-color:var(--brass)}
.card:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
.ev.golf .card{border-left:3px solid var(--fairway)}
.ev.key  .card{border-left:3px solid var(--brass)}
.chead{display:flex;gap:11px;align-items:flex-start}
.time{
  font-family:"Roboto Mono",monospace;font-size:13px;font-weight:700;
  color:var(--ink);flex:0 0 66px;padding-top:1px;font-variant-numeric:tabular-nums;
}
.cbody{flex:1;min-width:0}
.what{font-weight:700;font-size:15px;line-height:1.28;letter-spacing:-.006em}
.where{font-size:12.5px;color:var(--ink-2);margin-top:2px}
.caret{flex:0 0 auto;color:var(--ink-3);font-size:11px;padding-top:4px;transition:transform .2s}
.card[aria-expanded="true"] .caret{transform:rotate(90deg)}
.detail{display:none;margin-top:11px;padding-top:11px;border-top:1px solid var(--line);font-size:13.5px;color:var(--ink-2);line-height:1.55}
.card[aria-expanded="true"] + .detail{display:block}
.detail p{margin:0 0 8px}
.detail p:last-child{margin-bottom:0}
.detail a{color:var(--brass);font-weight:600}
/* inline links are thumb targets on a phone: give them real height without breaking the line */
.detail a:not(.maplink),.row .v a,.row .k a,.note a,.fmt-r a,.fmt-ex a,.crs-note a,.flag a{
  display:inline-block;min-height:34px;line-height:34px;padding:0 4px;margin:0 -4px;
  border-radius:5px;text-decoration:none;border-bottom:1px solid currentColor;
}
.detail a:not(.maplink):active,.row .v a:active,.note a:active{background:var(--brass-soft)}
a[href^="tel:"]::before{content:"\260E\FE0E";margin-right:5px;font-size:.85em;opacity:.75}
.maplink{
  display:flex;align-items:center;gap:10px;margin:0 0 11px;padding:9px 11px;
  border:1px solid var(--brass);border-radius:9px;background:var(--brass-soft);
  text-decoration:none;color:var(--ink);
}
.maplink:hover{background:var(--surface-2);border-color:var(--brass)}
.maplink:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
.maplink .pin{color:var(--brass);font-size:12px;line-height:1;flex:0 0 auto}
.maplink .mtxt{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.maplink .mtxt b{font-size:13.5px;font-weight:700;color:var(--ink)}
.maplink .mtxt i{font-size:11px;font-style:normal;color:var(--ink-3)}
.maplink .mgo{color:var(--brass);font-size:20px;line-height:1;flex:0 0 auto}

.pill{
  display:inline-block;font-family:"Roboto Mono",monospace;font-size:9.5px;font-weight:700;
  letter-spacing:.12em;text-transform:uppercase;padding:3px 7px;border-radius:4px;

    {t:"7:00 AM", at:D(10,3,7,0), w:"Guided bass fishing", p:"Table Rock Lake", loc:"marina", key:1, tags:["Ski","Trev","Joyce","Schmidty","3 CUP POINTS"],
     d:"<p>Four hours on the water with professional guides.</p><p><b>THREE CUP POINTS ARE ON THIS.</b> Most Fish, Big Bass and The Slam &mdash; see the Games tab for how each is won.</p><p><b>Mixed boats:</b> Ski with Joyce, Trev with Schmidty. Same water, same guide, so it&rsquo;s the anglers being tested and not the guides.</p><p><b>Missouri permits:</b> Courtney is sending the forms. <b>Fill yours in before you travel</b> &mdash; not at the dock.</p><p>About <b>$40 cash</b> for the guide at the dock.</p><p>Ask the guides to have us in by <b>10:45</b> if they can. It buys the whole morning some slack.</p>"},

     d:"<p>Gary Player, 13 par-3s, par 39. <b>Walking only &mdash; no carts.</b> About two hours, under two miles.</p><p><b>Kepps + Kurtz vs Heis + Jehls.</b> One point.</p><p><b>Strokes are already settled</b> and they&rsquo;re on the <b>Courses</b> tab. Look yours up before you leave the cottage, not on the first tee.</p><p>Rangefinders free at the shop.</p>"},

/* ---------- Courses ---------- */
function golfPanel(){
  const cc = c => {
    const badge = c.caddie==="yes" ? '<span class="pill p-golf" style="margin:0">Forecaddie booked</span>' : '';
    return '<div class="crs"><div class="crs-h"><div><div class="crs-n">'+c.n+'</div>'
      + '<div class="crs-a">'+c.arch+'</div></div>'
      + '<div class="crs-m"><span class="mono">Par '+c.par+'</span><span class="mono">'+c.pace+'</span>'
      + '<span class="mono" style="color:var(--brass)">'+c.when+'</span></div></div>'
      + '<p class="crs-note">'+c.note+'</p>'
      + '<div class="scroll"><table class="mtable tees"><thead><tr><th>Tee</th><th class="num">Yards</th><th class="num">Rating</th><th class="num">Slope</th></tr></thead><tbody>'
      + c.tees.map(t=>{const on=t[0]===c.rec;
          return '<tr'+(on?' class="rec"':'')+'><td>'+t[0]+(on?' &#9664; play this':'')+'</td><td class="num">'+t[1]+'</td><td class="num">'+t[2]+'</td><td class="num">'+t[3]+'</td></tr>';}).join("")
      + '</tbody></table></div>'
      + '<div style="margin-top:10px">'+(c.loc?mapBtn(c.loc):'')+'</div>'
      + (badge?'<div>'+badge+'</div>':'') + '</div>';
  };
  /* USGA Course Handicap = Index x (Slope / 113) + (Course Rating - Par).
     Full handicap, no allowances. Computed from the roster and the tee tables
     above, so it can never drift out of step with them. */
  const RATED = [
    {n:"Ozarks National", when:"Thu",    tee:"Blue/White"},
    {n:"Cliffhangers",    when:"Fri AM", tee:"Back"},
    {n:"Buffalo Ridge Springs", short:"Buffalo Ridge", when:"Fri PM", tee:"Blue/White"},
    {n:"Payne's Valley",  when:"Sat PM", tee:"Blue/White"}
  ];
  const chFor = (idx, c, teeName) => {
    const t = c.tees.find(x=>x[0]===teeName);
    const cr = parseFloat(t[2]), sl = parseFloat(t[3]);
    if(!isFinite(cr) || !isFinite(sl)) return null;
    return Math.round(idx * (sl/113) + (cr - c.par));
  };
  /* Mountain Top's card carries a men's handicap row even though the course is
     unrated. Hole -> stroke index, straight off the 2026 scorecard. */
  const MT_SI = SI["Mountain Top"];
  const mtHoles = n => {
    const hs = []; for(let h=1;h<=13;h++) if(MT_SI[h-1]<=n) hs.push(h);
    if(hs.length===13) return "every hole";
    const miss = []; for(let h=1;h<=13;h++) if(MT_SI[h-1]>n) miss.push(h);
    if(miss.length<=2) return "all but "+(miss.length===1?"hole ":"holes ")+miss.join(" and ");
    return hs.join(", ");
  };
  /* Mountain Top publishes no slope, so we price it off Cliffhangers — the other
     all-par-3 course on the trip — then scale 18 holes down to 13. Computed from
     the roster so it tracks any handicap or team change automatically. */
  const mtFour = () => {
    const cl = COURSES.find(c=>c.n==="Cliffhangers");
    const t  = cl.tees.find(x=>x[0]===cl.rec);
    const cr = parseFloat(t[2]), sl = parseFloat(t[3]);
    const four = ROSTER.filter(m=>m.sat==="Mountain Top")
      .map(m=>({k:m.k, h:m.h, t:m.t, c:Math.round(m.h*(sl/113)+(cr-cl.par))}))
      .sort((a,b)=>a.c-b.c);
    const lo = four[0].c;
    four.forEach(x=>x.s = Math.round((x.c-lo)*13/18));
    return four;
  };
  const mtTable = () => '<div class="box"><table class="mtable"><thead><tr>'
    + '<th>Man</th><th class="num">Strokes</th><th>On these holes</th></tr></thead><tbody>'
    + mtFour().map(x=>'<tr><td style="font-weight:700">'+x.k
        + '<br><span style="color:var(--'+(x.t==="Cleveland"?"cleveland":"world")+');font-size:10.5px;font-weight:600">'
        + (x.t==="Cleveland"?"Cleveland":"The World")+'</span></td>'
        + '<td class="num" style="font-weight:800;color:var(--brass);font-size:17px">'
        + (x.s===0?'<span style="font-size:13px;color:var(--ink-3);font-weight:600">&ndash;</span>':x.s)+'</td>'
        + '<td style="font-size:12px;color:var(--ink-2)">'
        + (x.s===0?'<span style="color:var(--ink-3)">plays scratch</span>':mtHoles(x.s))+'</td></tr>').join("")
    + '</tbody></table></div>';

  const chTable = () => {
    const cols = RATED.map(r=>{ const c = COURSES.find(x=>x.n===r.n); return {r:r, c:c}; });
    return '<div class="box scroll"><table class="mtable"><thead><tr><th>Man</th>'
      + cols.map(x=>'<th class="num" style="font-size:10.5px;line-height:1.2">'
          + (x.r.short||x.r.n).replace(" ","<br>") + '<br><span style="color:var(--ink-3);font-weight:400">'+x.r.when+'</span></th>').join("")
      + '</tr></thead><tbody>'
      + ROSTER.map(m=>'<tr><td style="font-weight:700">'+m.k
          + '<br><span style="color:var(--ink-3);font-size:10.5px;font-weight:400">'+m.h.toFixed(1)+'</span></td>'
          + cols.map(x=>'<td class="num" style="font-weight:700;color:var(--brass)">'+chFor(m.h,x.c,x.r.tee)+'</td>').join("")
          + '</tr>').join("")
      + '</tbody></table></div>';
  };

  return '<div class="panel" id="p-golf" role="tabpanel">'
  + '<h2>Your strokes</h2>'
  + '<div class="flag"><b>Worked out before we land</b>Nobody is doing arithmetic on a first tee. These are your <b>course handicaps</b> &mdash; full handicap, no allowances &mdash; off the tees we&rsquo;re playing. Know your number before Thursday.</div>'
  + chTable()
  + '<p class="note">Index &times; (Slope &divide; 113) + (Rating &minus; Par), rounded. <b>Final numbers land the Monday before we fly</b> once everyone&rsquo;s weekend rounds post.</p>'
  + '<h2>Mountain Top &mdash; settled</h2>'
  + '<div class="flag"><b>Thirteen holes, and the course has no rating</b>So there is no course handicap to look up. Ryan priced it off a rated par-3 course of the same character and scaled it to 13 holes. <b>These are your strokes</b> &mdash; nothing to work out on the walk to the first tee.</div>'
  + mtTable()
  + '<p class="note">Best Ball, one Cup point. Holes come straight off the <b>handicap row on Mountain Top&rsquo;s own scorecard</b> &mdash; hole 2 is the hardest at 221 yards, hole 4 the easiest at 82.</p>'

/* ============================ BUILD ============================ */
$("#tabs").innerHTML = TABS.map((t,i)=>'<button class="tab" role="tab" data-t="'+t.id+'" aria-selected="'+(i===0)+'" aria-controls="p-'+t.id+'">'+t.label+'</button>').join("");
$("#panels").innerHTML = itinPanel() + cupPanel() + gamesPanel() + golfPanel() + moneyPanel() + bankPanel() + resortPanel();

function show(id){
  document.querySelectorAll(".panel").forEach(p=>p.classList.toggle("on", p.id==="p-"+id));
  document.querySelectorAll(".tab").forEach(b=>{
    const on = b.dataset.t===id;
    b.setAttribute("aria-selected", String(on));
    if(on) b.scrollIntoView({block:"nearest",inline:"nearest"});
  });
  window.scrollTo({top:0,behavior:"instant"});
}
$("#tabs").addEventListener("click", e=>{ const b=e.target.closest(".tab"); if(b) show(b.dataset.t); });
document.addEventListener("click", e=>{
  const b = e.target.closest("[data-acc]"); if(!b) return;
  b.setAttribute("aria-expanded", b.getAttribute("aria-expanded")==="true" ? "false" : "true");
});

const NOW = () => new Date();
const ALL = DAYS.flatMap(d => d.events.map(e => ({...e, day:d.id})));
function pickDay(){
  const n=NOW();
  const d=DAYS.find(day=>day.events.some(e=>e.at.toDateString()===n.toDateString()));
  return d ? d.id : DAYS[0].id;
}
let curDay = pickDay();
function showDay(id, scroll){
  curDay = id;
  document.querySelectorAll("[data-dayblock]").forEach(b=>b.classList.toggle("on", b.dataset.dayblock===id));
  document.querySelectorAll(".daychip").forEach(c=>c.setAttribute("aria-selected", String(c.dataset.day===id)));
  renderNext();
  if(scroll) window.scrollTo({top:0,behavior:"instant"});
}
$("#daychips").addEventListener("click", e=>{ const c=e.target.closest(".daychip"); if(c) showDay(c.dataset.day, true); });

function renderNext(){
  const host=$("#nextup"); if(!host) return;
  const n=NOW(), up=ALL.find(e=>e.at>n);
  host.innerHTML = (up && up.day===curDay)
    ? '<div class="nextup"><div class="lbl">Next up</div><div class="ttl">'+up.w+'</div><div class="meta">'+up.t+' &middot; '+up.p+'</div></div>'
    : "";
}
showDay(curDay, false);
show("itin");

function tickCD(){
  const start=D(10,1,8,15), end=D(10,4,12,29), n=NOW(), cd=$("#cd"), lbl=$("#cdl");
  if(n<start){ const days=Math.ceil((start-n)/864e5); cd.textContent=days; lbl.textContent=days===1?"day out":"days out"; }
  else if(n<=end){ cd.textContent="LIVE"; lbl.textContent="we're there"; }
  else { cd.textContent="—"; lbl.textContent="that's a wrap"; }
}
tickCD(); setInterval(()=>{tickCD();renderNext();},60000);

/* ---------- the Cup leaderboard ---------- */
let results={};
try{ const raw=localStorage.getItem("farmcup2"); if(raw) results=JSON.parse(raw)||{}; }catch(_){}

/* built once, then only the button state changes — so a tap never rebuilds the list,
   never drops focus, and never moves the page under your thumb */
function buildMatches(){
  const host=$("#matches"); if(!host) return;
  host.innerHTML = MATCHES.map(m=>
      '<div class="match"><div class="mtop"><span class="mses">'+m.s+'</span>'
    + '<span class="pill p-golf" style="margin:0">'+m.f+'</span></div>'
    + '<div class="mvs"><span class="a">'+m.a+'</span><span class="v">v</span><span class="b">'+m.b+'</span></div>'
    + '<div class="mbtns" role="group" aria-label="'+m.a.replace(/&amp;/g,"and")+' versus '+m.b.replace(/&amp;/g,"and")+'">'
    + [['Cleveland','Cleveland'],['Halved','Halved'],['World','The World']].map(x=>'<button type="button" class="mbtn" aria-pressed="false" data-w="'+x[0]+'" data-m="'+m.id+'">'+x[1]+'</button>').join("")
    + '</div></div>').join("");
  paintCup();
}
function paintCup(){
  document.querySelectorAll(".mbtn").forEach(b=>{
    const on = results[b.dataset.m]===b.dataset.w;
    b.classList.toggle("on", on);
    b.setAttribute("aria-pressed", String(on));
  });
  let A=0,B=0;
  Object.values(results).forEach(v=>{ if(v==="Cleveland")A++; else if(v==="World")B++; else if(v==="Halved"){A+=.5;B+=.5;} });
  const f = x => x===0 ? "0" : String(x).replace(/\.5$/,"½").replace(/^0½$/,"½");
  $("#ptsA").textContent=f(A); $("#ptsB").textContent=f(B);
  const played=Object.keys(results).length, st=$("#sstat");
  if(A>=7.5) st.innerHTML='<b>Cleveland wins the Farm Cup.</b>';
  else if(B>=7.5) st.innerHTML='<b>The World wins the Farm Cup.</b>';
  else if(played===14) st.innerHTML='<b>7&ndash;7. Shared &mdash; or settle it on the 19th.</b>';
  else st.innerHTML=(14-played)+' match'+(14-played===1?'':'es')+' left. <b>First to 7&frac12; wins it.</b>';
}
buildMatches();
document.addEventListener("click", e=>{
  const b=e.target.closest(".mbtn"); if(!b) return;
  const id=b.dataset.m, w=b.dataset.w;
  if(results[id]===w) delete results[id]; else results[id]=w;
  paintCup();
  try{ localStorage.setItem("farmcup2", JSON.stringify(results)); }catch(_){}
});


/* ---------- live results feed ----------
   results.json is the published source of truth. Anything it names overrides a
   local tap; anything it doesn't name still falls back to this phone's taps.
   Missing, empty or broken file = the page renders exactly as it does today. */
const esc = t => String(t==null?"":t).replace(/[&<>]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
const mo  = n => { const v=Number(n); return isFinite(v) ? "$"+v.toFixed(2).replace(/\.00$/,"") : ""; };

function paintLive(d){
  if(d.matches && typeof d.matches==="object"){
    const ok=new Set(MATCHES.map(m=>m.id)), val=["Cleveland","World","Halved"];
    let n=0;
    Object.keys(d.matches).forEach(k=>{
      if(ok.has(k) && val.indexOf(d.matches[k])>-1){ results[k]=d.matches[k]; n++; }
    });
    if(n){ paintCup(); const ln=$("#livenote"); if(ln) ln.textContent="Results published by Ryan. Your own taps only show for matches he hasn't posted yet."; }
  }
  const band=$("#liveband");
  if(band && (d.updated || d.headline)){
    band.innerHTML='<div class="live"><div class="lh"><span class="dot"></span>Live</div>'
      + (d.updated  ? '<div class="lu">Updated '+esc(d.updated)+'</div>' : '')
      + (d.headline ? '<div class="lmsg">'+esc(d.headline)+'</div>' : '')
      + '</div>';
  }
  const host=$("#liveskins");
  if(host && Object.prototype.toString.call(d.skins)==="[object Array]" && d.skins.length){
    host.innerHTML='<h2>Skins so far</h2><div class="box">'
    + d.skins.map(function(s){
        const ws=(s.winners&&s.winners.length?s.winners:[]).map(function(x){
          const h=Number(x.holes)||0;
          return '<div class="skw"><span>'+esc(x.who)+(h?' &middot; '+h+' hole'+(h===1?'':'s'):'')
               + '</span><b>'+mo(x.amt)+'</b></div>';
        }).join("") || '<div class="skw"><span>No skins won</span><b>all carried</b></div>';
        const meta=[ s.pot!=null?mo(s.pot)+' pot':'', s.carried?mo(s.carried)+' carried in':'' ].filter(Boolean).join(' &middot; ');
        return '<div class="sk"><div class="skh"><span class="skr">'+esc(s.round)+'</span>'
             + (meta?'<span class="skp">'+meta+'</span>':'') + '</div>' + ws
             + (s.note?'<div class="skn">'+esc(s.note)+'</div>':'') + '</div>';
      }).join("")
    + '</div>';
  }
}
try{
  /* file:// has no origin, so fetch throws a CORS error into the console for anyone
     who opens this straight off disk. The page is identical either way — just don't
     make the noise. */
  if(!/^https?:/.test(location.protocol)) throw 0;
  fetch("results.json?t="+Date.now(), {cache:"no-store"})
    .then(function(r){ return r.ok ? r.json() : null; })
    .then(function(d){ if(d && typeof d==="object") paintLive(d); })
    .catch(function(){});
}catch(_){}


/* Build stamp. The numbers are baked in when the file is built, so what you see
   is what was published — no clock, no cache, no guessing which copy you have. */
const BUILD = {v:"2", d:"14 Sep 2026", t:"2026-09-14T19:52:03Z"};
(function(){
  const v=$("#bv"), d=$("#bd"); if(!v||!d) return;
  v.textContent = BUILD.v; d.textContent = BUILD.d;
  const ms = Date.parse(BUILD.t);
  if(isFinite(ms)){
    const days = Math.floor((Date.now()-ms)/86400000);
    d.parentElement.title = "Published "+BUILD.d;
    if(days<=1) d.parentElement.classList.add("fresh");
    if(days>=2) d.textContent = BUILD.d+" \u00b7 "+days+" days ago";
  }
})();

</script>
